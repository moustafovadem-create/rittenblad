<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7c400">
<title>Rittenblad</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px}.top{position:sticky;top:0;z-index:20;background:#f7c400;padding:14px 16px 12px;box-shadow:0 2px 10px #0001}.top h1{margin:0;font-size:21px}.top p{margin:3px 0 0;font-size:12px;font-weight:700;color:#5b4a00}.tabs{display:flex;gap:7px;padding:10px 12px;background:#f3f4f6;position:sticky;top:65px;z-index:19}.tabs button{flex:1;border:0;border-radius:12px;padding:11px 4px;background:#e5e7eb;font-weight:800;color:#374151}.tabs button.on{background:#111827;color:#fff}.page{display:none;padding:0 12px 18px}.page.on{display:block}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 3px 12px #0000000a}.pad{padding:15px}.period{display:flex;gap:7px;margin-bottom:11px}.period button{flex:1;border:0;border-radius:11px;padding:10px;background:#e5e7eb;font-weight:800}.period button.on{background:#f7c400}.stats h2,.section-title{font-size:14px;color:#6b7280;margin:0 0 8px}.stat{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9}.stat:last-child{border:0}.stat b{font-size:18px}.hero-btn,.secondary{width:100%;min-height:54px;border:0;border-radius:16px;font-size:16px;font-weight:900;margin-bottom:10px}.hero-btn{background:#f7c400}.secondary{background:#111827;color:#fff}.outline{background:#fff;color:#374151;border:1px solid #d1d5db}.record-photo{width:100%;height:220px;object-fit:cover;background:#e5e7eb;display:block}.rec-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.rec-title{font-weight:900;font-size:18px}.badge{background:#fff7d1;color:#6b5600;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.info{background:#f8fafc;border-radius:12px;padding:10px}.info small{display:block;color:#6b7280;font-weight:700}.info b{display:block;margin-top:3px}.stops{margin:9px 0 0;padding-left:20px}.stops li{margin:5px 0}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900}.edit{background:#f7c400}.del{background:#fee2e2;color:#991b1b}.empty{text-align:center;padding:28px 16px;color:#6b7280}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-height:95dvh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}.sheet h3{margin:0 35px 8px 0}.close{float:right;border:0;background:none;font-size:24px;color:#6b7280}.preview{width:100%;max-height:310px;object-fit:contain;background:#f3f4f6;border-radius:14px;margin:8px 0 12px}label{display:block;font-size:13px;font-weight:800;color:#4b5563;margin:11px 0 5px}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px;font:inherit;font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{padding:12px;border-radius:12px;background:#fff7d1;color:#6b5600;font-weight:700;margin:10px 0;white-space:pre-line}.status.bad{background:#fee2e2;color:#991b1b}.status.good{background:#dcfce7;color:#166534}.toast{display:none;position:fixed;left:12px;right:12px;bottom:82px;z-index:80;background:#111827;color:#fff;border-radius:13px;padding:13px;font-weight:800}.toast.on{display:block}.settings-note{font-size:13px;line-height:1.5;color:#6b7280}.danger{color:#991b1b}.photo-modal{align-items:center;padding:12px}.photo-modal .sheet{border-radius:18px;padding:10px;max-height:95vh}.photo-modal img{width:100%;max-height:85vh;object-fit:contain}.loading{display:none}.loading.on{display:block}.spinner{width:24px;height:24px;border:3px solid #ddd;border-top-color:#111827;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top"><h1>🚚 Rittenblad</h1><p>A. M. Moustafov · 2-EUJ-368</p></header>
<nav class="tabs"><button class="on" data-page="home">Özet</button><button data-page="days">Günler</button><button data-page="settings">Ayarlar</button></nav>
<main>
<section id="home" class="page on">
 <div class="period"><button class="on" data-period="week">Bu hafta</button><button data-period="month">Bu ay</button><button data-period="all">Hepsi</button></div>
 <div class="card pad stats"><h2 id="periodTitle">Bu hafta</h2><div id="stats"></div></div>
 <button class="hero-btn" onclick="document.getElementById('camera').click()">📷 Fotoğraf çek</button>
 <button class="secondary" onclick="document.getElementById('gallery').click()">🖼️ Galeriden seç</button>
 <button class="secondary outline" onclick="openEditor()">✍️ Elle kayıt ekle</button>
 <input id="camera" type="file" accept="image/*" capture="environment" hidden>
 <input id="gallery" type="file" accept="image/*" hidden>
 <h2 class="section-title">Son kayıtlar</h2><div id="recent"></div>
</section>
<section id="days" class="page"><div id="records"></div></section>
<section id="settings" class="page">
 <div class="card pad"><h2 class="section-title">Gemini fotoğraf okuma</h2><p class="settings-note">API anahtarı yalnızca bu tarayıcının yerel hafızasında tutulur. Bu, küçük kişisel denemeler için uygundur; anahtarı başkalarıyla paylaşma.</p><label>Gemini API anahtarı</label><input id="apiKey" type="password" placeholder="AIza..."><label>Model</label><input id="model" value="gemini-2.5-flash"><button class="hero-btn" style="margin-top:12px" onclick="saveSettings()">Ayarları kaydet</button><button class="secondary outline" onclick="testConnection()">Bağlantıyı test et</button><div id="testStatus"></div></div>
 <div class="card pad"><h2 class="section-title">Yedek</h2><button class="secondary outline" onclick="backup()">⬇️ Yedek indir</button><button class="secondary outline" onclick="document.getElementById('restore').click()">⬆️ Yedeği geri yükle</button><input id="restore" type="file" accept="application/json" hidden><button class="secondary outline danger" onclick="deleteAll()">🗑️ Bütün kayıtları sil</button></div>
</section>
</main>
<div id="editor" class="modal"><div class="sheet"><button class="close" onclick="closeEditor()">✕</button><h3 id="editorTitle">Kaydı kontrol et</h3><div id="loading" class="status loading"><span class="spinner"></span>Fotoğraf okunuyor…</div><img id="editPhoto" class="preview" hidden><label>Tarih</label><input id="fDate" placeholder="20.11.2026"><div class="two"><div><label>Şoför</label><input id="fDriver"></div><div><label>Plaka</label><input id="fPlate"></div></div><div class="two"><div><label>Evden çıkış</label><input id="fStart" placeholder="06:45"></div><div><label>Eve giriş</label><input id="fEnd" placeholder="18:00"></div></div><div class="two"><div><label>Toplam KM</label><input id="fKm" type="number" step="0.1"></div><div><label>Peage €</label><input id="fPeage" type="number" step="0.01"></div></div><label>Müşteriler (her satıra bir müşteri)</label><textarea id="fStops" rows="6"></textarea><div id="readStatus"></div><div class="two" style="margin-top:15px"><button class="secondary outline" onclick="closeEditor()">Vazgeç</button><button class="hero-btn" onclick="saveRecord()">Kaydet</button></div></div></div>
<div id="photoViewer" class="modal photo-modal" onclick="closePhoto()"><div class="sheet"><img id="fullPhoto"></div></div><div id="toast" class="toast"></div>
<script>
const DB='RittenbladApp_v2', STORE='records'; let db, items=[], period='week', editingId=null, currentPhoto='';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').className='toast on';clearTimeout(window._tt);window._tt=setTimeout(()=>$('toast').className='toast',4500)}
function openDB(){return new Promise((ok,bad)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>bad(r.error)})}
function allDB(){return new Promise((ok,bad)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>bad(r.error)})}
function putDB(o){return new Promise((ok,bad)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(o);t.oncomplete=ok;t.onerror=()=>bad(t.error)})}
function delDB(id){return new Promise((ok,bad)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=ok;t.onerror=()=>bad(t.error)})}
function clearDB(){return new Promise((ok,bad)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).clear();t.oncomplete=ok;t.onerror=()=>bad(t.error)})}
function parseDate(s){const m=String(s||'').match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);if(!m)return null;const d=new Date(+m[3],+m[2]-1,+m[1],12);return d.getFullYear()==+m[3]&&d.getMonth()==+m[2]-1&&d.getDate()==+m[1]?d:null}
function fmtDate(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}
function normTime(s){const m=String(s||'').match(/(\d{1,2})\s*(?:[:.uU])\s*(\d{2})/);if(!m)return '';const h=+m[1],n=+m[2];return h<24&&n<60?String(h).padStart(2,'0')+':'+String(n).padStart(2,'0'):''}
function duration(a,b){a=normTime(a);b=normTime(b);if(!a||!b)return 0;let x=+b.slice(0,2)*60 + +b.slice(3)-(+a.slice(0,2)*60 + +a.slice(3));return x<0?x+1440:x}
function durText(n){return n?Math.floor(n/60)+' sa '+String(n%60).padStart(2,'0')+' dk':'—'}
function euro(n){return (+n||0).toFixed(2).replace('.',',')+' €'}
function dayName(d){return ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][d.getDay()]}
function selected(r){const d=parseDate(r.date);if(!d)return false;if(period==='all')return true;const now=new Date();if(period==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();const mon=new Date(now);mon.setHours(0,0,0,0);mon.setDate(now.getDate()-((now.getDay()+6)%7));const end=new Date(mon);end.setDate(mon.getDate()+7);return d>=mon&&d<end}
function sorted(){return [...items].sort((a,b)=>(parseDate(b.date)||0)-(parseDate(a.date)||0))}
function render(){const s=items.filter(selected);let mins=0,km=0,pay=0,cust=0;s.forEach(r=>{mins+=+r.durationMinutes||0;km+=+r.km||0;pay+=+r.peage||0;cust+=(r.stops||[]).length});$('periodTitle').textContent=period==='week'?'Bu hafta':period==='month'?'Bu ay':'Bütün kayıtlar';$('stats').innerHTML=[['Çalışılan gün',s.length],['Toplam süre',durText(mins)],['Toplam kilometre',km.toFixed(1)+' km'],['Toplam peage',euro(pay)],['Toplam müşteri',cust]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');const list=sorted();$('records').innerHTML=list.length?list.map(card).join(''):'<div class="card empty">Henüz kayıt yok.</div>';$('recent').innerHTML=list.length?list.slice(0,3).map(card).join(''):'<div class="card empty">Fotoğraf çekerek ilk kaydı ekle.</div>'}
function card(r){return `<article class="card">${r.photo?`<img class="record-photo" src="${r.photo}" onclick="openPhoto('${r.id}')">`:''}<div class="pad"><div class="rec-head"><div><div class="rec-title">${esc(r.date)} · ${esc(r.day||'')}</div><small>${esc(r.driver||'A. M. Moustafov')} · ${esc(r.plate||'2-EUJ-368')}</small></div><span class="badge">${(r.stops||[]).length} müşteri</span></div><div class="grid"><div class="info"><small>Saat</small><b>${esc(r.startTime||'?')} → ${esc(r.endTime||'?')}</b></div><div class="info"><small>Süre</small><b>${durText(r.durationMinutes)}</b></div><div class="info"><small>Kilometre</small><b>${(+r.km||0).toFixed(1)} km</b></div><div class="info"><small>Peage</small><b>${euro(r.peage)}</b></div></div>${(r.stops||[]).length?`<b>Müşteriler</b><ol class="stops">${r.stops.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}<div class="actions"><button class="edit" onclick="editRecord('${r.id}')">✏️ Düzenle</button><button class="del" onclick="removeRecord('${r.id}')">🗑️ Sil</button></div></div></article>`}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.page).classList.add('on')});document.querySelectorAll('.period button').forEach(b=>b.onclick=()=>{period=b.dataset.period;document.querySelectorAll('.period button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()});
function resetForm(){editingId=null;currentPhoto='';$('editPhoto').hidden=true;$('fDate').value=fmtDate(new Date());$('fDriver').value='A. M. Moustafov';$('fPlate').value='2-EUJ-368';['fStart','fEnd','fKm','fPeage','fStops'].forEach(x=>$(x).value='');$('readStatus').innerHTML=''}
function openEditor(){resetForm();$('editorTitle').textContent='Elle kayıt ekle';$('editor').classList.add('on')}
function closeEditor(){$('editor').classList.remove('on');$('loading').classList.remove('on')}
function editRecord(id){const r=items.find(x=>x.id===id);if(!r)return;editingId=id;currentPhoto=r.photo||'';$('editorTitle').textContent='Kaydı düzenle';$('fDate').value=r.date||'';$('fDriver').value=r.driver||'';$('fPlate').value=r.plate||'';$('fStart').value=r.startTime||'';$('fEnd').value=r.endTime||'';$('fKm').value=r.km||'';$('fPeage').value=r.peage||'';$('fStops').value=(r.stops||[]).join('\n');$('editPhoto').hidden=!currentPhoto;if(currentPhoto)$('editPhoto').src=currentPhoto;$('editor').classList.add('on')}
async function saveRecord(){const d=parseDate($('fDate').value);if(!d)return toast('Tarihi 20.11.2026 şeklinde yaz.');const start=normTime($('fStart').value),end=normTime($('fEnd').value),stops=$('fStops').value.split('\n').map(x=>x.trim()).filter(Boolean);const id=editingId||'gun-'+d.toISOString().slice(0,10);const r={id,date:fmtDate(d),day:dayName(d),driver:$('fDriver').value.trim(),plate:$('fPlate').value.trim(),startTime:start,endTime:end,durationMinutes:duration(start,end),km:+$('fKm').value||0,peage:+$('fPeage').value||0,stops,photo:currentPhoto,updatedAt:Date.now()};await putDB(r);items=await allDB();closeEditor();render();toast('Kayıt kaydedildi ✔')}
async function removeRecord(id){if(!confirm('Bu kayıt silinsin mi?'))return;await delDB(id);items=await allDB();render();toast('Kayıt silindi')}
function openPhoto(id){const r=items.find(x=>x.id===id);if(!r?.photo)return;$('fullPhoto').src=r.photo;$('photoViewer').classList.add('on')}
function closePhoto(){$('photoViewer').classList.remove('on')}
function resizeImage(file,max=1800){return new Promise((ok,bad)=>{const rd=new FileReader();rd.onerror=bad;rd.onload=e=>{const im=new Image();im.onerror=bad;im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){const q=max/Math.max(w,h);w=Math.round(w*q);h=Math.round(h*q)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);ok(c.toDataURL('image/jpeg',.9))};im.src=e.target.result};rd.readAsDataURL(file)})}
async function handleImage(file){if(!file)return;resetForm();$('editorTitle').textContent='Fotoğrafı kontrol et';$('editor').classList.add('on');$('loading').classList.add('on');try{currentPhoto=await resizeImage(file);$('editPhoto').src=currentPhoto;$('editPhoto').hidden=false;const data=await readWithGemini(currentPhoto);fillAI(data);$('readStatus').innerHTML='<div class="status good">Fotoğraf okundu. Bilgileri kontrol edip Kaydet düğmesine bas.</div>'}catch(e){$('readStatus').innerHTML='<div class="status bad">Okuma başarısız: '+esc(e.message)+'\nAlanları elle doldurup yine de kaydedebilirsin.</div>'}finally{$('loading').classList.remove('on')}}
$('camera').onchange=e=>{handleImage(e.target.files[0]);e.target.value=''};$('gallery').onchange=e=>{handleImage(e.target.files[0]);e.target.value=''};
function fillAI(a){$('fDate').value=a.date||$('fDate').value;$('fDriver').value=a.driver||'A. M. Moustafov';$('fPlate').value=a.plate||'2-EUJ-368';$('fStart').value=normTime(a.startTime);$('fEnd').value=normTime(a.endTime);$('fKm').value=+a.km||'';$('fPeage').value=+a.peage||'';$('fStops').value=(Array.isArray(a.stops)?a.stops:[]).filter(x=>!/\b(thuis|moderna|modernea)\b/i.test(x)).join('\n')}
const PROMPT=`Bu fotoğraf Belçika'da kullanılan el yazılı bir Rittenblad formudur. Yalnızca geçerli JSON döndür: {"driver":"","plate":"","date":"GG.AA.YYYY","startTime":"SS:DD","endTime":"SS:DD","km":0,"peage":0,"stops":[]}. Kurallar: driver NAAM alanıdır; plate NR-PLAAT alanıdır; date DATUM alanıdır; startTime ilk Thuis satırındaki Vertrek saatidir; endTime son Thuis satırındaki Aankomst saatidir; 07u15 gibi saatleri 07:15 yap; km KM-Stand sütunundaki en büyük değerdir; peage Peage sütunundaki son toplam değerdir; stops yalnızca gerçek müşteri/adres adlarıdır. Thuis, Moderna, Modernea ve bunları içeren başlangıç/bitiş satırlarını stops içine koyma. Okunamayan metni uydurma, boş bırak.`;
async function readWithGemini(dataUrl){const key=localStorage.getItem('rb_api_key');if(!key)throw new Error('Ayarlar bölümüne Gemini API anahtarı girilmemiş.');const model=localStorage.getItem('rb_model')||'gemini-2.5-flash';const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';const body={contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}}]}],generationConfig:{response_mime_type:'application/json',temperature:0}};const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});let j={};try{j=await res.json()}catch{}if(!res.ok)throw new Error(j?.error?.message||('Gemini hatası '+res.status));const text=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');if(!text)throw new Error('Gemini boş cevap verdi.');try{return JSON.parse(text.replace(/```json|```/g,'').trim())}catch{throw new Error('Gemini geçerli JSON döndürmedi.') }}
function saveSettings(){const k=$('apiKey').value.trim();if(k)localStorage.setItem('rb_api_key',k);localStorage.setItem('rb_model',$('model').value.trim()||'gemini-2.5-flash');toast('Ayarlar kaydedildi')}
async function testConnection(){saveSettings();const out=$('testStatus');out.innerHTML='<div class="status">Bağlantı test ediliyor…</div>';try{const key=localStorage.getItem('rb_api_key');if(!key)throw new Error('API anahtarı yok.');const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models',{headers:{'x-goog-api-key':key}});const j=await r.json();if(!r.ok)throw new Error(j?.error?.message||('Hata '+r.status));out.innerHTML='<div class="status good">Bağlantı çalışıyor ✔</div>'}catch(e){out.innerHTML='<div class="status bad">'+esc(e.message)+'</div>'}}
function backup(){const blob=new Blob([JSON.stringify({version:2,items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rittenblad-yedek-'+fmtDate(new Date()).replaceAll('.','-')+'.json';a.click();URL.revokeObjectURL(a.href)}
$('restore').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.items))throw new Error('Geçersiz yedek');await clearDB();for(const r of j.items)await putDB(r);items=await allDB();render();toast('Yedek geri yüklendi')}catch(x){toast('Yedek yüklenemedi: '+x.message)}e.target.value=''};
async function deleteAll(){if(!confirm('Bütün kayıtlar kalıcı olarak silinsin mi?'))return;await clearDB();items=[];render();toast('Bütün kayıtlar silindi')}
(async()=>{await openDB();items=await allDB();$('apiKey').value=localStorage.getItem('rb_api_key')||'';$('model').value=localStorage.getItem('rb_model')||'gemini-2.5-flash';render()})().catch(e=>toast('Uygulama açılamadı: '+e.message));
</script>
</body>
</html>
