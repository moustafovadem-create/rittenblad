*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:20px}.hdr{background:#f7c400;padding:14px 16px;position:sticky;top:0;z-index:20}.hdr h1{margin:0;font-size:20px;font-weight:900}.hdr p{margin:2px 0 0;font-size:12px;font-weight:700;color:#4a3c00}.nav{display:flex;gap:6px;padding:10px 12px 0;position:sticky;top:65px;background:#f4f5f7;z-index:19}.nav button,.period button{flex:1;padding:11px 4px;border:0;border-radius:12px;background:#e5e7eb;color:#374151;font-size:13px;font-weight:800}.nav button.on,.period button.on{background:#111827;color:#fff}.sec{display:none;padding:12px;max-width:680px;margin:auto}.sec.on{display:block}.period{display:flex;gap:6px;margin-bottom:10px}.c{background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:12px;overflow:hidden}.ct{display:block;padding:12px 14px 0;font-size:13px;color:#6b7280;font-weight:800}.big{padding:6px 12px 8px}.s{display:flex;justify-content:space-between;align-items:baseline;padding:11px 4px;border-bottom:1px solid #f3f4f6}.s:last-child{border:0}.s i{font-style:normal;font-size:14px;color:#4b5563;font-weight:650}.s b{font-size:19px;font-weight:900}.s:nth-child(2) b{color:#b45309}.day{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #f3f4f6}.day:last-child{border:0}.l{flex:1;min-width:0}.t{font-weight:900;font-size:15px}.m{font-size:13px;color:#4b5563;margin-top:3px;line-height:1.45}.r{text-align:right;white-space:nowrap}.r b{display:block;font-size:16px}.r small{font-size:12px;color:#6b7280}.tap{cursor:pointer}.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:#f7c400;color:#111;font-size:16px;font-weight:900;margin-bottom:10px}.btn2{background:#111827;color:#fff}.btn3{background:#fff;border:1px solid #d1d5db;color:#374151}.hint{font-size:13px;color:#6b7280;line-height:1.5}.mini{border:0;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:800;margin:7px 5px 0 0}.mini.pho{background:#fff5bf}.mini.del{background:#fee2e2;color:#991b1b}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:50}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-width:680px;margin:auto;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}.x{float:right;font-size:22px;color:#9ca3af;background:none;border:0}.sheet h3{margin:0 35px 6px 0}.ph{width:100%;max-height:330px;object-fit:contain;border-radius:12px;margin-top:10px;border:1px solid #e5e7eb;background:#f3f4f6}label{display:block;font-size:13px;font-weight:800;color:#4b5563;margin:12px 0 5px}input,textarea{width:100%;padding:13px;font-size:16px;border-radius:12px;border:1px solid #d1d5db;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{background:#fff7e6;border:1px solid #f7c400;border-radius:12px;padding:12px;font-size:13px;line-height:1.5;color:#7c4a00;margin:10px 0;white-space:pre-line}.status.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}.status.good{background:#dcfce7;color:#166534;border-color:#bbf7d0}.toast{position:fixed;left:10px;right:10px;bottom:14px;background:#111827;color:#fff;padding:14px;border-radius:12px;font-size:14px;font-weight:700;z-index:90;display:none}.toast.on{display:block}.loading{display:none}.loading.on{display:block}.spin{width:21px;height:21px;border:3px solid #ddd;border-top-color:#111827;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.db{background:#f8fafc;border-radius:11px;padding:10px}.db small{display:block;color:#6b7280;font-size:12px}.db b{display:block;margin-top:3px}.photoModal{align-items:center;padding:12px}.photoModal .sheet{border-radius:18px;padding:10px}.photoModal img{width:100%;max-height:86vh;object-fit:contain}@media(max-width:390px){.two{grid-template-columns:1fr}}
</style></head><body>
<header class="hdr"><h1>Rittenblad</h1><p>A. M. Moustafov · 2-EUJ-368</p></header><nav class="nav"><button class="on" data-page="home">Özet</button><button data-page="days">Günler</button><button data-page="settings">Ayarlar</button></nav>
<section id="home" class="sec on"><div class="period"><button class="on" data-period="week">Bu hafta</button><button data-period="month">Bu ay</button><button data-period="all">Hepsi</button></div><div class="c"><b class="ct" id="sumTitle">Bu hafta</b><div class="big" id="stats"></div></div><div class="c"><b class="ct">En son günler</b><div id="recent"></div></div><button class="btn" onclick="camera.click()">📷 Rittenblad fotoğrafı ekle</button><input id="camera" type="file" accept="image/*" capture="environment" hidden><button class="btn btn2" onclick="gallery.click()">🖼 Galeriden seç</button><input id="gallery" type="file" accept="image/*" hidden><button class="btn btn3" onclick="openEditor()">✍️ Elle kayıt ekle</button></section>
<section id="days" class="sec"><div class="c"><div id="list"></div></div></section>
<section id="settings" class="sec"><div class="c" style="padding:14px"><b>Gemini fotoğraf okuma</b><p class="hint">Anahtar yalnızca bu telefonda saklanır. GitHub koduna yazılmaz.</p><label>Gemini API anahtarı</label><input id="apiKey" type="password" placeholder="API anahtarı"><label>Model</label><input id="model" value="gemini-3.8-flash"><button class="btn" style="margin-top:12px" onclick="saveSettings()">Ayarları kaydet</button><button class="btn btn3" onclick="testConnection()">Bağlantıyı test et</button><div id="testStatus"></div></div><button class="btn btn3" onclick="backup()">⬇️ Yedek al</button><button class="btn btn3" onclick="restore.click()">⬆️ Yedeği geri yükle</button><input id="restore" type="file" accept="application/json" hidden><button class="btn btn3" style="color:#991b1b" onclick="deleteAll()">🗑️ Bütün kayıtları sil</button></section>
<div id="editor" class="modal"><div class="sheet"><button class="x" onclick="closeEditor()">✕</button><h3 id="edTitle">Kaydı kontrol et</h3><div id="loading" class="status loading"><span class="spin"></span>Fotoğraf okunuyor…</div><img id="edPhoto" class="ph" hidden><label>Tarih</label><input id="fDate" placeholder="20.11.2026"><div class="two"><div><label>Şoför</label><input id="fDriver"></div><div><label>Plaka</label><input id="fPlate"></div></div><div class="two"><div><label>Evden çıkış</label><input id="fStart" placeholder="06:45"></div><div><label>Eve giriş</label><input id="fEnd" placeholder="18:00"></div></div><div class="two"><div><label>Toplam KM</label><input id="fKm" type="number" step=".1"></div><div><label>Yol parası €</label><input id="fPeage" type="number" step=".01"></div></div><label>Müşteriler (her satıra bir müşteri)</label><textarea id="fStops" rows="6"></textarea><div id="readStatus"></div><div class="two" style="margin-top:15px"><button class="btn btn3" onclick="closeEditor()">Vazgeç</button><button class="btn" onclick="saveRecord()">Kaydet</button></div></div></div>
<div id="detail" class="modal"><div class="sheet"><button class="x" onclick="closeDetail()">✕</button><h3 id="dTitle"></h3><img id="dPhoto" class="ph" hidden><div id="dBody"></div><div class="two" style="margin-top:15px"><button class="btn btn3" onclick="closeDetail()">Kapat</button><button class="btn" id="dEdit">Düzenle</button></div></div></div><div id="photo" class="modal photoModal" onclick="photo.classList.remove('on')"><div class="sheet"><img id="fullPhoto"></div></div><div id="toast" class="toast"></div>
<script>
const DB='RittenbladApp_v2',STORE='records',$=x=>document.getElementById(x);let db,items=[],period='week',editing=null,currentPhoto='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(s){toast.textContent=s;toast.className='toast on';clearTimeout(window.tt);window.tt=setTimeout(()=>toast.className='toast',4500)}function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>no(r.error)})}function all(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}function put(o){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(o);t.oncomplete=ok;t.onerror=()=>no(t.error)})}function del(id){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}function clearDB(){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).clear();t.oncomplete=ok;t.onerror=()=>no(t.error)})}
function pd(s){let m=String(s||'').match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);if(!m)return null;let d=new Date(+m[3],+m[2]-1,+m[1],12);return d.getMonth()==+m[2]-1?d:null}function fd(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}function nt(s){let m=String(s||'').match(/(\d{1,2})\s*[:.uU]\s*(\d{2})/);return m&&+m[1]<24&&+m[2]<60?String(+m[1]).padStart(2,'0')+':'+m[2]:''}function mins(a,b){a=nt(a);b=nt(b);if(!a||!b)return 0;let n=+b.slice(0,2)*60 + +b.slice(3)-(+a.slice(0,2)*60 + +a.slice(3));return n<0?n+1440:n}function dur(n){return n?Math.floor(n/60)+' sa '+String(n%60).padStart(2,'0')+' dk':'—'}function eur(n){return (+n||0).toFixed(2).replace('.',',')+' €'}function dn(d){return ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][d.getDay()]}function sorted(){return [...items].sort((a,b)=>(pd(b.date)||0)-(pd(a.date)||0))}function chosen(r){let d=pd(r.date);if(!d)return false;if(period==='all')return true;let n=new Date();if(period==='month')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();let m=new Date(n);m.setHours(0,0,0,0);m.setDate(n.getDate()-((n.getDay()+6)%7));let e=new Date(m);e.setDate(m.getDate()+7);return d>=m&&d<e}
function render(){let a=items.filter(chosen),mi=0,km=0,pe=0,cu=0;a.forEach(r=>{mi+=+r.durationMinutes||0;km+=+r.km||0;pe+=+r.peage||0;cu+=(r.stops||[]).length});sumTitle.textContent=period==='week'?'Bu hafta':period==='month'?'Bu ay':'Bütün kayıtlar';stats.innerHTML=[['Çalışılan gün',a.length],['Toplam süre',dur(mi)],['Toplam kilometre',km.toFixed(1)+' km'],['Toplam yol parası',eur(pe)],['Toplam müşteri',cu]].map(x=>`<div class="s"><i>${x[0]}</i><b>${x[1]}</b></div>`).join('');let l=sorted();recent.innerHTML=l.length?l.slice(0,5).map(shortRow).join(''):'<div class="day"><div class="l">Henüz kayıt yok.</div></div>';list.innerHTML=l.length?l.map(longRow).join(''):'<div class="day"><div class="l">Henüz kayıt yok.</div></div>'}function shortRow(r){return `<div class="day tap" onclick="openDetail('${r.id}')"><div class="l"><div class="t">${esc(r.date)} ${esc(r.day||'')}</div><div class="m">${dur(r.durationMinutes)} · ${(+r.km||0).toFixed(1)} km · ${eur(r.peage)}</div></div><div class="r"><b>${(r.stops||[]).length}</b><small>müşteri</small></div></div>`}function longRow(r){return `<div class="day"><div class="l tap" onclick="openDetail('${r.id}')"><div class="t">${esc(r.date)} · ${esc(r.day||'')}</div><div class="m">🕕 ${esc(r.startTime||'?')} → ${esc(r.endTime||'?')} (${dur(r.durationMinutes)})<br>📏 ${(+r.km||0).toFixed(1)} km · 💶 ${eur(r.peage)} · 👥 ${(r.stops||[]).length} müşteri${(r.stops||[]).length?'<br>📍 '+esc(r.stops.join(', ')):''}</div>${r.photo?`<button class="mini pho" onclick="event.stopPropagation();openPhoto('${r.id}')">🖼 Fotoğraf</button>`:''}<button class="mini" onclick="event.stopPropagation();editRecord('${r.id}')">Düzenle</button><button class="mini del" onclick="event.stopPropagation();removeRecord('${r.id}')">Sil</button></div></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.page).classList.add('on')});document.querySelectorAll('.period button').forEach(b=>b.onclick=()=>{period=b.dataset.period;document.querySelectorAll('.period button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()});
function reset(){editing=null;currentPhoto='';edPhoto.hidden=true;fDate.value=fd(new Date());fDriver.value='A. M. Moustafov';fPlate.value='2-EUJ-368';['fStart','fEnd','fKm','fPeage','fStops'].forEach(x=>$(x).value='');readStatus.innerHTML=''}function openEditor(){reset();edTitle.textContent='Elle kayıt ekle';editor.classList.add('on')}function closeEditor(){editor.classList.remove('on');loading.classList.remove('on')}function editRecord(id){let r=items.find(x=>x.id===id);if(!r)return;editing=id;currentPhoto=r.photo||'';edTitle.textContent=r.date+' kaydını düzenle';fDate.value=r.date||'';fDriver.value=r.driver||'';fPlate.value=r.plate||'';fStart.value=r.startTime||'';fEnd.value=r.endTime||'';fKm.value=r.km||'';fPeage.value=r.peage||'';fStops.value=(r.stops||[]).join('\n');edPhoto.hidden=!currentPhoto;if(currentPhoto)edPhoto.src=currentPhoto;editor.classList.add('on')}async function saveRecord(){let d=pd(fDate.value);if(!d)return note('Tarihi 20.11.2026 gibi yaz.');let a=nt(fStart.value),b=nt(fEnd.value),st=fStops.value.split('\n').map(x=>x.trim()).filter(Boolean),id=editing||'gun-'+d.toISOString().slice(0,10),r={id,date:fd(d),day:dn(d),driver:fDriver.value.trim(),plate:fPlate.value.trim(),startTime:a,endTime:b,durationMinutes:mins(a,b),km:+fKm.value||0,peage:+fPeage.value||0,stops:st,photo:currentPhoto,updatedAt:Date.now()};await put(r);items=await all();closeEditor();render();note('Kayıt kaydedildi ✔')}async function removeRecord(id){if(!confirm('Kayıt silinsin mi?'))return;await del(id);items=await all();render();note('Kayıt silindi')}
function openDetail(id){let r=items.find(x=>x.id===id);if(!r)return;dTitle.textContent=r.date+' · '+(r.day||'');dPhoto.hidden=!r.photo;if(r.photo)dPhoto.src=r.photo;dBody.innerHTML=`<div class="dg"><div class="db"><small>Şoför</small><b>${esc(r.driver||'')}</b></div><div class="db"><small>Plaka</small><b>${esc(r.plate||'')}</b></div><div class="db"><small>Saat</small><b>${esc(r.startTime||'?')} → ${esc(r.endTime||'?')}</b></div><div class="db"><small>Süre</small><b>${dur(r.durationMinutes)}</b></div><div class="db"><small>Kilometre</small><b>${(+r.km||0).toFixed(1)} km</b></div><div class="db"><small>Peage</small><b>${eur(r.peage)}</b></div></div>${(r.stops||[]).length?`<b>Müşteriler (${r.stops.length})</b><ol>${r.stops.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}`;dEdit.onclick=()=>{closeDetail();editRecord(id)};detail.classList.add('on')}function closeDetail(){detail.classList.remove('on')}function openPhoto(id){let r=items.find(x=>x.id===id);if(!r?.photo)return;fullPhoto.src=r.photo;photo.classList.add('on')}
function resize(f,max=1800){return new Promise((ok,no)=>{let rd=new FileReader;rd.onerror=no;rd.onload=e=>{let im=new Image;im.onerror=no;im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){let q=max/Math.max(w,h);w=Math.round(w*q);h=Math.round(h*q)}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);ok(c.toDataURL('image/jpeg',.9))};im.src=e.target.result};rd.readAsDataURL(f)})}async function handle(f){if(!f)return;reset();edTitle.textContent='Fotoğrafı kontrol et';editor.classList.add('on');loading.innerHTML='<span class="spin"></span>Fotoğraf okunuyor…';loading.classList.add('on');try{currentPhoto=await resize(f);edPhoto.src=currentPhoto;edPhoto.hidden=false;let a=await ai(currentPhoto);fDate.value=a.date||fDate.value;fDriver.value=a.driver||fDriver.value;fPlate.value=a.plate||fPlate.value;fStart.value=nt(a.startTime);fEnd.value=nt(a.endTime);fKm.value=+a.km||'';fPeage.value=+a.peage||'';fStops.value=(Array.isArray(a.stops)?a.stops:[]).filter(x=>!/\b(thuis|moderna|modernea)\b/i.test(x)).join('\n');readStatus.innerHTML='<div class="status good">Fotoğraf okundu. Bilgileri kontrol edip Kaydet düğmesine bas.</div>'}catch(e){readStatus.innerHTML='<div class="status bad">Okuma başarısız: '+esc(e.message)+'\nAlanları elle doldurup kaydedebilirsin.</div>'}finally{loading.classList.remove('on')}}camera.onchange=e=>{handle(e.target.files[0]);e.target.value=''};gallery.onchange=e=>{handle(e.target.files[0]);e.target.value=''};
const PROMPT=`Bu fotoğraf Belçika'da kullanılan el yazılı bir Rittenblad formudur. Yalnızca geçerli JSON döndür: {"driver":"","plate":"","date":"GG.AA.YYYY","startTime":"SS:DD","endTime":"SS:DD","km":0,"peage":0,"stops":[]}. driver=NAAM, plate=NR-PLAAT, date=DATUM, startTime=ilk Thuis satırındaki Vertrek, endTime=son Thuis satırındaki Aankomst. 07u15 biçimini 07:15 yap. km=KM-Stand sütunundaki en büyük değer. peage=Peage sütunundaki son toplam değer. stops yalnız gerçek müşteriler; Thuis, Moderna, Modernea satırlarını ekleme. Okunmayanı uydurma.`;async function ai(data){let key=localStorage.getItem('rb_api_key');if(!key)throw Error('Ayarlar bölümüne API anahtarı girilmemiş.');let mod=localStorage.getItem('rb_model')||'gemini-3.8-flash',url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(mod)+':generateContent',body={contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:'image/jpeg',data:data.split(',')[1]}}]}],generationConfig:{response_mime_type:'application/json'}},wait=[0,2000,4000,8000],last='Bağlantı hatası';for(let i=0;i<wait.length;i++){if(wait[i]){loading.innerHTML='<span class="spin"></span>Sunucu yoğun. Otomatik yeniden deneniyor ('+(i+1)+'/4)…';await new Promise(r=>setTimeout(r,wait[i]+Math.random()*700))}let res,j={};try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});try{j=await res.json()}catch{}}catch(e){last='İnternet bağlantısı kurulamadı.';if(i<3)continue;throw Error(last)}if(res.ok){let t=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');if(!t)throw Error('Gemini boş cevap verdi.');try{return JSON.parse(t.replace(/```json|```/g,'').trim())}catch{throw Error('Geçerli JSON alınamadı.')}}last=j?.error?.message||'Gemini hatası '+res.status;if(!(res.status===408||res.status===429||res.status>=500)||i===3)throw Error(last)}throw Error(last)}
function saveSettings(){if(apiKey.value.trim())localStorage.setItem('rb_api_key',apiKey.value.trim());localStorage.setItem('rb_model',model.value.trim()||'gemini-3.8-flash');note('Ayarlar kaydedildi')}async function testConnection(){saveSettings();testStatus.innerHTML='<div class="status">Bağlantı test ediliyor…</div>';try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models',{headers:{'x-goog-api-key':localStorage.getItem('rb_api_key')}}),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'Hata '+r.status);testStatus.innerHTML='<div class="status good">Bağlantı çalışıyor ✔</div>'}catch(e){testStatus.innerHTML='<div class="status bad">'+esc(e.message)+'</div>'}}function backup(){let b=new Blob([JSON.stringify({version:2,items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rittenblad-yedek.json';a.click()}restore.onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.items))throw Error('Geçersiz yedek');await clearDB();for(let r of j.items)await put(r);items=await all();render();note('Yedek geri yüklendi')}catch(x){note(x.message)}e.target.value=''};async function deleteAll(){if(!confirm('Bütün kayıtlar silinsin mi?'))return;await clearDB();items=[];render();note('Bütün kayıtlar silindi')}
(async()=>{await openDB();items=await all();apiKey.value=localStorage.getItem('rb_api_key')||'';model.value=localStorage.getItem('rb_model')||'gemini-3.8-flash';render()})().catch(e=>note('Uygulama açılamadı: '+e.message));
</script></body></html>
